name: Release

# Pushing a tag is the whole instruction: `git tag -a v1.2.0 -m "..." && git push origin v1.2.0`
# builds, tests, packages, and publishes an archive with the binaries already in it. Nobody has to
# have a Mac, a toolchain, or a checkout to install CodecBlue — that is the point of a release.
on:
  push:
    tags:
      - "v*"

permissions:
  # Needed to create the release and upload the archive.
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # `git describe` needs the tags, and the version comes from them. Without this the
          # checkout is a shallow clone with no tags and every release would call itself
          # 0.0.0-development — which is exactly the kind of bug that ships once and is noticed
          # by a user rather than by CI.
          fetch-depth: 0

      # The same gate as a normal push. A tag is not a reason to skip the tests: it is the one
      # build that reaches people who will never run them.
      - name: Format and lint
        run: make lint

      - name: Build and test
        run: make test

      # The certificate has to be in a keychain before `codesign` can use it, and a keychain in CI
      # has to be created, unlocked and (on macOS) given permission to be used without a prompt.
      # The `.p12` and its password live in repository secrets and exist nowhere else.
      - name: Import the signing certificate
        if: ${{ secrets.CODECBLUE_SIGN_P12 != '' }}
        env:
          P12: ${{ secrets.CODECBLUE_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.CODECBLUE_SIGN_P12_PASSWORD }}
        run: |
          set -eu
          keychain="$RUNNER_TEMP/signing.keychain-db"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p actions "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p actions "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign
          # Without this, `codesign` blocks on a GUI prompt that nobody can answer on a runner and
          # the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Package
        env:
          # All of these are optional. With them the archive is signed, notarised and stapled, which
          # is what makes it open on a Mac that has never seen it. Without them it is ad-hoc signed
          # and the packaging script says so out loud instead of pretending.
          CODECBLUE_SIGN_IDENTITY: ${{ secrets.CODECBLUE_SIGN_IDENTITY }}
          CODECBLUE_NOTARY_KEY_ID: ${{ secrets.CODECBLUE_NOTARY_KEY_ID }}
          CODECBLUE_NOTARY_ISSUER: ${{ secrets.CODECBLUE_NOTARY_ISSUER }}
          # Passed as an environment variable and written to a file here, rather than interpolated
          # into the shell: a secret pasted into a script body ends up in the log if the command is
          # ever echoed, and a key that is valid for a year is worth not leaking.
          NOTARY_KEY_P8: ${{ secrets.CODECBLUE_NOTARY_KEY_P8 }}
        run: |
          set -eu
          if [ -n "${NOTARY_KEY_P8:-}" ]; then
            printf '%s' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"
            chmod 600 "$RUNNER_TEMP/notary-key.p8"
            export CODECBLUE_NOTARY_KEY="$RUNNER_TEMP/notary-key.p8"
          fi
          sh scripts/package.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          archive=".build/dist/CodecBlue-${version}.zip"
          checksum="${archive}.sha256"
          test -f "$archive" || { echo "no archive at $archive" >&2; exit 1; }

          # The notes are the commit subjects since the previous tag, which is the only changelog
          # that cannot drift from the code. `git describe --tags --abbrev=0 HEAD^` finds the tag
          # before this one; on the first release there is none and the whole history is the notes.
          previous=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$previous" ]; then
            range="${previous}..HEAD"
            heading="Changes since ${previous}"
          else
            range="HEAD"
            heading="First release"
          fi
          {
            echo "## ${heading}"
            echo
            git log --no-merges --pretty='- %s' "$range"
            echo
            echo "## Install"
            echo
            echo 'Download the `.zip` below, unzip it, and run `./install.sh` inside the folder.'
            echo "It asks for your password once, for the audio driver, and nothing else."
            echo
            echo '```sh'
            echo "shasum -a 256 -c CodecBlue-${version}.zip.sha256"
            echo '```'
            echo
            echo "Requires an Apple Silicon Mac and macOS 14.2 or later."
            # What the notes say about Gatekeeper has to match what the archive actually is, so
            # the packaging script leaves a marker rather than this step guessing from the same
            # secrets a second time — two copies of a condition is two answers waiting to differ.
            if [ -f ".build/dist/notarised" ]; then
              echo
              echo "Signed and notarised by Apple."
            else
              echo
              echo "> This build is not notarised: on first launch macOS will refuse it and you"
              echo "> have to right-click the app, choose Open, and confirm. That is expected."
            fi
          } > notes.md

          # `--verify-tag` because the tag must already exist: this workflow runs *because* of a
          # tag, and a release created from a branch would be a release of something else.
          gh release create "$GITHUB_REF_NAME" \
            --title "CodecBlue ${version}" \
            --notes-file notes.md \
            --verify-tag \
            "$archive" "$checksum"

      - name: Keep the archive as an artifact too
        # The release asset can be deleted or the release unpublished; the artifact stays attached
        # to the run for 90 days, which is what makes a bad release diagnosable after the fact.
        uses: actions/upload-artifact@v4
        with:
          name: CodecBlue-${{ github.ref_name }}
          path: .build/dist/CodecBlue-*.zip*
