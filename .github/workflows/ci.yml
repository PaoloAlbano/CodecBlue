name: CI

on:
  push:
  pull_request:

# Needed by the coverage step, which commits the number to the `badges` branch. Read-only
# everywhere else: a workflow that can write to the repository should say so at the top.
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # `make lint` and `make test`, and not the tools directly, so that a green CI and a green
      # `make check` on a laptop mean the same thing. The first version of this file ran the test
      # binary itself and drifted from what a person runs by hand — which is how a test that
      # depended on the machine (an installed copy of the app in ~/Applications) passed here and
      # failed on the runner.
      #
      # Two steps and not one, because they fail for different reasons and the log should say
      # which: a formatting error is a `make format` away, a test failure is not.
      #
      # `swift-format` comes with the toolchain (`xcrun swift-format`), so there is nothing to
      # install and no version to pin: the runner's Xcode and the laptop's Command Line Tools are
      # both found through `xcrun`, and `.swift-format` in the repository is the whole
      # configuration.
      - name: Format and lint
        run: make lint

      - name: Build and test
        run: make test

      # The coverage badge has to read its number from somewhere over HTTPS, and shields.io's
      # "endpoint" badge does that by fetching a small JSON file. So the number lives in the
      # repository — but on a branch of its own, not on `main`.
      #
      # Why not `main`: this repository's history is curated by hand (commits are squashed and
      # reworded before they are pushed), and a bot committing to `main` on every push would put
      # a commit in the middle of that every time the number moves by a tenth of a percent. The
      # badge does not care which branch the file is on, so it goes on `badges`, which nothing
      # else reads.
      #
      # Why not an artifact: artifacts expire after 90 days and need a token to read. A badge that
      # goes blank is worse than no badge.
      #
      # Only on `main`, only on a push: a pull request must not be able to write to the repository.
      - name: Measure coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: make coverage

      - name: Publish the coverage number
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -eu
          sh scripts/coverage.sh --update
          # stderr carries the progress lines, so this captures the JSON document alone. The first
          # version did not, and the commit subject on the badges branch read "coverage: building
          # with instrumentation… running the self-test… 26.6%".
          number=$(sh scripts/coverage.sh --json 2>/dev/null | sed 's/.*"message": "\([^"]*\)".*/\1/')
          [ -n "$number" ] || { echo "could not read the coverage number" >&2; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A worktree of the badges branch, so the checkout of `main` is never touched: switching
          # branches under a running job is how a later step ends up building the wrong tree.
          #
          # It has to start from `origin/badges` when that exists, and the first version did not:
          # it created a *new* branch called `badges` from main's HEAD, so the push was rejected
          # with "fetch first" on the second run — the branch had diverged from the remote the
          # moment the first run created it. `-B` moves an existing local branch onto the remote
          # one, which is what makes the second run and the hundredth behave like the first.
          if git fetch --quiet origin badges 2>/dev/null; then
            git worktree add --force -B badges "$RUNNER_TEMP/badges" origin/badges
          else
            echo "no badges branch yet: creating it"
            git worktree add --force -b badges "$RUNNER_TEMP/badges"
          fi
          cp .github/coverage.json "$RUNNER_TEMP/badges/coverage.json"
          cd "$RUNNER_TEMP/badges"
          git add coverage.json
          # Nothing to commit means the number did not move, which is the common case and not a
          # failure: `git diff --quiet` would exit 1 there and fail the job.
          if git diff --cached --quiet; then
            echo "coverage unchanged at $number"
            exit 0
          fi
          # The trailer is on every commit in this repository, and a bot commit is not an
          # exception: the history should not need a footnote explaining which commits are
          # co-authored and which are not.
          git commit -m "coverage: $number" \
            -m "Co-authored-by: DomynAgents <no-reply@domyn.com>"
          git push origin badges
